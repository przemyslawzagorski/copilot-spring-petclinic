# ============================================================================
# MCP Toolbox Configuration for PostgreSQL Hotel Search
# ============================================================================
# This file defines the database connection and SQL tools for the agent.
# 
# Supported PostgreSQL providers:
# - Neon.tech (recommended - free tier available)
# - Supabase (free tier available)
# - Railway.app ($5 free credits)
# - Local PostgreSQL
# ============================================================================

sources:
  # PostgreSQL connection
  hotels-database:
    kind: "postgres"

    # Connection parameters (only these fields are supported)
    host: "YOUR_POSTGRES_HOST"
    port: 5432
    database: "YOUR_DATABASE"
    user: "YOUR_DATABASE_USER"
    password: "YOUR_DATABASE_PASSWORD"

    # Example for Neon.tech:
    # Parse: postgresql://neondb_owner:PASSWORD@ep-xxxxx.us-east-2.aws.neon.tech/neondb
    # host: "ep-xxxxx.us-east-2.aws.neon.tech"
    # port: 5432
    # database: "neondb"
    # user: "neondb_owner"
    # password: "PASSWORD"

    # Example for Supabase:
    # Parse: postgresql://postgres.xxxxx:PASSWORD@aws-0-us-east-1.pooler.supabase.com:6543/postgres
    # host: "aws-0-us-east-1.pooler.supabase.com"
    # port: 6543
    # database: "postgres"
    # user: "postgres.xxxxx"
    # password: "PASSWORD"

# ============================================================================
# TOOLS - SQL queries exposed as agent tools
# ============================================================================

tools:
  # Search hotels by name (partial match)
  search-hotels-by-name:
    kind: postgres-sql
    source: hotels-database
    description: Search for hotels based on name. Supports partial matching (e.g., "Hilton" will find all Hilton hotels).
    parameters:
      - name: name
        type: string
        description: The name or partial name of the hotel to search for
    statement: |
      SELECT id, name, location, rating, price_per_night, description
      FROM hotels
      WHERE name ILIKE '%' || $1 || '%'
      ORDER BY rating DESC;

  # Search hotels by location
  search-hotels-by-location:
    kind: postgres-sql
    source: hotels-database
    description: Search for hotels in a specific city or location. Returns all hotels in that location sorted by rating.
    parameters:
      - name: location
        type: string
        description: The city or location to search for hotels in
    statement: |
      SELECT id, name, location, rating, price_per_night, description
      FROM hotels
      WHERE location ILIKE '%' || $1 || '%'
      ORDER BY rating DESC;

  # Search hotels by price range
  search-hotels-by-price-range:
    kind: postgres-sql
    source: hotels-database
    description: Find hotels within a specific price range per night. Returns hotels sorted by price.
    parameters:
      - name: min_price
        type: integer
        description: Minimum price per night in PLN
      - name: max_price
        type: integer
        description: Maximum price per night in PLN
    statement: |
      SELECT id, name, location, rating, price_per_night, description
      FROM hotels
      WHERE price_per_night BETWEEN $1 AND $2
      ORDER BY price_per_night ASC;

  # Get hotel by ID
  get-hotel-by-id:
    kind: postgres-sql
    source: hotels-database
    description: Get detailed information about a specific hotel by its unique ID.
    parameters:
      - name: hotel_id
        type: integer
        description: The unique identifier of the hotel
    statement: |
      SELECT id, name, location, rating, price_per_night, description
      FROM hotels
      WHERE id = $1;

  # Get top rated hotels
  get-top-rated-hotels:
    kind: postgres-sql
    source: hotels-database
    description: Get the top-rated hotels across all locations. Returns hotels with rating 4.5 or higher.
    parameters:
      - name: limit
        type: integer
        description: Maximum number of hotels to return (default 10)
    statement: |
      SELECT id, name, location, rating, price_per_night, description
      FROM hotels
      WHERE rating >= 4.5
      ORDER BY rating DESC
      LIMIT $1;

  # Execute an arbitrary read-only SELECT query
  # ---------------------------------------------------------------------------
  # The "postgres-execute-sql" kind exposes a single free-form `sql` parameter
  # instead of a fixed `statement`. The agent supplies the full SQL text at
  # call time, which makes it ideal for ad-hoc exploration of the database.
  #
  # WARNING: this tool runs WHATEVER SQL the agent sends - it does not enforce
  # SELECT-only access by itself. According to the official docs it is meant for
  # "developer assistant workflows with human-in-the-loop" and should NOT be
  # used by autonomous production agents. To make it truly read-only, connect
  # the `hotels-database` source with a database user that only has SELECT
  # privileges (e.g. a dedicated read-only role).
  # ---------------------------------------------------------------------------
  execute-select:
    kind: postgres-execute-sql
    source: hotels-database
    description: >
      Execute an arbitrary read-only SELECT query against the hotels database
      and return the resulting rows. Pass the complete SQL statement in the
      `sql` parameter, for example:
      "SELECT name, location, rating FROM hotels WHERE rating > 4 ORDER BY rating DESC LIMIT 5".
      Use this for ad-hoc questions that the predefined hotel-search tools do not
      cover. Only SELECT statements are intended - do not issue INSERT, UPDATE,
      DELETE or DDL.

# ============================================================================
# TOOLSETS - Groups of tools that can be used together
# ============================================================================

toolsets:
  hotel_search_toolset:
    - search-hotels-by-name
    - search-hotels-by-location
    - search-hotels-by-price-range
    - get-hotel-by-id
    - get-top-rated-hotels
    - execute-select

